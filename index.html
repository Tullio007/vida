<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Para você ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Georgia", "Times New Roman", serif;
  }
  #heart {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .message {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 7%;
    text-align: center;
    color: #ffd6e0;
    z-index: 2;
    pointer-events: none;
    padding: 0 20px;
    text-shadow: 0 0 18px rgba(255, 60, 110, 0.7);
    opacity: 0;
    animation: fadeUp 2.5s ease forwards;
    animation-delay: 1.5s;
  }
  .message h1 {
    font-size: clamp(28px, 8vw, 56px);
    font-weight: normal;
    letter-spacing: 1px;
  }
  .message p {
    margin-top: 14px;
    font-size: clamp(15px, 4.5vw, 22px);
    color: #ff9bb3;
    font-style: italic;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <canvas id="heart"></canvas>
  <div class="message">
    <h1>Eu te amo ❤️</h1>
    <p>de longe ou de perto, você é a minha vida. Te amo meu amor</p>
  </div>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx, cy, scale;

function resize() {
  W = canvas.width = Math.floor(window.innerWidth * DPR);
  H = canvas.height = Math.floor(window.innerHeight * DPR);
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  cx = W / 2;
  cy = H / 2.15;
  scale = Math.min(W, H) / 40;
}
resize();

// Parametric heart curve (unit space, ~[-16..16] x [-17..12])
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
  return { x, y };
}

// Approx normal distribution centred on 0
function gauss() {
  return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
}

let particles = [];
function build() {
  const area = (window.innerWidth * window.innerHeight);
  const COUNT = Math.max(2000, Math.min(5000, Math.round(area / 220)));
  particles = [];
  for (let i = 0; i < COUNT; i++) {
    const t = Math.random() * Math.PI * 2;
    const base = heartPoint(t);
    const ang = Math.random() * Math.PI * 2;
    // most particles hug the outline, a few drift into a soft cloud
    const dist = Math.abs(gauss()) * 1.7;
    const hue = 332 + Math.random() * 22;            // pink -> magenta
    const light = 55 + Math.random() * 22;
    particles.push({
      bx: base.x, by: base.y,
      ang,
      d0: dist,
      amp: 0.25 + Math.random() * 0.6,               // shimmer amplitude
      phase: Math.random() * Math.PI * 2,
      freq: 0.02 + Math.random() * 0.04,
      size: (0.6 + Math.random() * 1.3) * DPR,
      alpha: 0.45 + Math.random() * 0.4,
      color: `hsl(${hue}, 95%, ${light}%)`,
    });
  }
}
build();
window.addEventListener("resize", () => { resize(); build(); });

let frame = 0;
function animate() {
  frame++;
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  // gentle heartbeat (double thump) -> overall scale pulse
  const cycle = (frame % 78) / 78;
  let beat = 1;
  if (cycle < 0.12) beat += Math.sin(cycle / 0.12 * Math.PI) * 0.06;
  else if (cycle < 0.30) beat += Math.sin((cycle - 0.16) / 0.14 * Math.PI) * 0.035;

  // additive blending: dense outline glows bright, scattered cloud stays soft
  ctx.globalCompositeOperation = "lighter";

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    const d = p.d0 + Math.sin(frame * p.freq + p.phase) * p.amp;
    const ux = p.bx + Math.cos(p.ang) * d;
    const uy = p.by + Math.sin(p.ang) * d;
    const x = cx + ux * scale * beat;
    const y = cy + uy * scale * beat;
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(x, y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
